/text><text x="1070.0" y="290.0" font-family="Kalpurush" font-size="22.5" font-weight="400" fill="#2E3842" text-anchor="middle">ধাতুতে তাপ বাড়লে রোধ</text><text x="1070.0" y="320.1" font-family="Kalpurush" font-size="22.5" font-weight="400" fill="#2E3842" text-anchor="middle">বাড়ে</text><text x="1070.0" y="372.0" font-family="Kalpurush" font-size="23" font-weight="700" fill="#B32A22" text-anchor="middle"></text><rect x="60.0" y="426.0" width="1120.0" height="74.0" rx="12" fill="#F5F9FC" stroke="#0F3357" stroke-width="2"/><text x="620.0" y="462.0" font-family="Kalpurush" font-size="32" font-weight="700" fill="#0F3357" text-anchor="middle">R = ρ × L / A</text><text x="620.0" y="492.0" font-family="Kalpurush" font-size="22.5" font-weight="400" fill="#5A6470" text-anchor="middle">ρ = আপেক্ষিক রোধ · L = দৈর্ঘ্য · A = প্রস্থচ্ছেদের ক্ষেত্রফল</text></svg>