<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="728" viewBox="0 0 1240 728"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path d="M 0.5 0.8 L 9.5 5 L 0.5 9.2 z" fill="#1D5B8F"/></marker></defs><rect width="1240" height="728" fill="#FFFFFF"/><text x="620.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">বাসবার হিসাবের ধাপ</text><rect x="400.0" y="117.0" width="440.0" height="66.0" rx="10" fill="#EAF2FA" stroke="#1D5B8F" stroke-width="2.6"/><text x="620.0" y="159.5" font-family="Kalpurush" font-size="28" font-weight="700" fill="#0F3357" text-anchor="middle">মোট লোড  (kW বা kVA)</text><line x1="620.0" y1="183.0" x2="620.0" y2="224.0" stroke="#1D5B8F" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="200.0" y="232.0" width="340.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#1D5B8F" stroke-width="2.6"/><text x="370.0" y="264.0" font-family="Kalpurush" font-size="23" font-weight="700" fill="#1D5B8F" text-anchor="middle">এক ফেজ</text><text x="370.0" y="304.0" font-family="Kalpurush" font-size="23.5" font-weight="700" fill="#0F3357" text-anchor="middle">I = P / (V × cos φ)</text><path d="M 370.0 328 L 370.0 366 L 620 366" fill="none" stroke="#1D5B8F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="700.0" y="232.0" width="340.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#0F3357" stroke-width="2.6"/><text x="870.0" y="264.0" font-family="Kalpurush" font-size="23" font-weight="700" fill="#0F3357" text-anchor="middle">তিন ফেজ</text><text x="870.0" y="304.0" font-family="Kalpurush" font-size="23.5" font-weight="700" fill="#0F3357" text-anchor="middle">I = P / (1.732 × V × cos φ)</text><path d="M 870.0 328 L 870.0 366 L 620 366" fill="none" stroke="#1D5B8F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="620.0" y1="366.0" x2="6