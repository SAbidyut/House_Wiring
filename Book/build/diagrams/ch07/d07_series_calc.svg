<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520"><defs><marker id="ars" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path d="M 0.5 0.8 L 9.5 5 L 0.5 9.2 z" fill="#B32A22"/></marker></defs><rect width="1240" height="520" fill="#FFFFFF"/><text x="620.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">সিরিজ সার্কিটে রোধ ও ভোল্টেজের হিসাব</text><circle cx="168.0" cy="300.0" r="30.0" fill="#FFFFFF" stroke="#12324D" stroke-width="3.2"/><path d="M 149.4 300 q 9.3 -19.53 18.6 0 q 9.3 19.53 18.6 0" fill="none" stroke="#12324D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 168 190 L 168 270" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 168 330 L 168 400" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="122.0" y="308.0" font-family="Kalpurush" font-size="22.5" font-weight="700" fill="#0F3357" text-anchor="end">V = 230 V</text><path d="M 168 190 L 336 190" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="336.0" y="167.0" width="124.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#12324D" stroke-width="3.2"/><text x="398.0" y="142.0" font-family="Kalpurush" font-size="22.5" font-weight="700" fill="#0F3357" text-anchor="middle">R1 = 100 Ω</text><text x="398.0" y="256.0" font-family="Kalpurush" font-size="22.5" font-weight="700" fill="#B32A22" text-anchor="middle">V1</text><path d="M 460.0 190 L 558 190" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="558.0" y="167.0" width="124.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#12324D" stroke-width="3.2"/><text x="620.0" y="142.0" font-family="Kalpurush" font-size="22.5" font-weight="700" fill="#0F3357" text-anchor="middle">R2 = 200 Ω</text><text x="620.0" y="256.0" font-family="Kalpurush" font-size="22.5" font-weight="700" fill="#B32A22" text-anchor="middle">V2</text><path d="M 682.0 190 L 780 190" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="780.0" y="167.0" width="124.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#12324D" stroke-width="3.2"/><text x="842.0" y="142.0" font-family="Kalpurush" font-size="22.5" font-weight="700" fill="#0F3357" text-anchor="middle">R3 = 160 Ω</text><text x="842.0" y="256.0" font-family="Kalpurush" font-size="22.5" font-weight="700" fill="#B32A22" text-anchor="middle">V3</text><path d="M 904.0 190 L 1072 190" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1072 190 L 1072 400" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1072 400 L 168 400" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 700 378 L 540 378" fill="none" stroke="#B32A22" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ars)"/><text x="620.0" y="358.0" font-family="Kalpurush" font-size="22.5" font-weight="700" fill="#B32A22" text-anchor="middle">I: প্রতিটি রোধে একই কারেন্ট</text><rect x="46.0" y="438.0" width="1148.0" height="60.0" rx="11" fill="#FFF6E5" stroke="#B47500" stroke-width="2"/><text x="620.0" y="476.0" font-family="Kalpurush" font-size="25.5" font-weight="700" fill="#7A5200" text-anchor="middle">RT = R1 + R2 + R3    এবং    V = V1 + V2 + V3    (কারেন্ট I সব রোধে সমান)</text></svg>