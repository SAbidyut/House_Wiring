<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="534" viewBox="0 0 1240 534"><rect width="1240" height="534" fill="#FFFFFF"/><text x="620.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">মিশ্র সার্কিটের হিসাব — R1 সিরিজে, R2 ও R3 প্যারালালে</text><circle cx="190.0" cy="300.0" r="30.0" fill="#FFFFFF" stroke="#12324D" stroke-width="3.2"/><path d="M 171.4 300 q 9.3 -19.53 18.6 0 q 9.3 19.53 18.6 0" fill="none" stroke="#12324D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 190 186 L 190 270" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 190 330 L 190 420" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="144.0" y="308.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="end">V = 230 V</text><path d="M 190 186 L 268 186" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="268.0" y="163.0" width="124.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#12324D" stroke-width="3.2"/><text x="330.0" y="138.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="middle">R1 = 30 Ω</text><path d="M 392 186 L 520 186" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="520.0" cy="186.0" r="5.5" fill="#12324D" stroke="none" stroke-width="2"/><path d="M 520 186 L 520 330" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 520 186 L 648 186" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="648.0" y="163.0" width="124.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#12324D" stroke-width="3.2"/><text x="710.0" y="138.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="middle">R2 = 250 Ω</text><path d="M 772 186 L 900 186" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 520 330 L 648 330" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="648.0" y="307.0" width="124.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#12324D" stroke-width="3.2"/><text x="710.0" y="396.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="middle">R3 = 1000 Ω</text><path d="M 772 330 L 900 330" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 900 330 L 900 186" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="900.0" cy="186.0" r="5.5" fill="#12324D" stroke="none" stroke-width="2"/><text x="502.0" y="166.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#B32A22" text-anchor="end">A</text><text x="918.0" y="166.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#B32A22" text-anchor="start">B</text><path d="M 900 186 L 1082 186" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1082 186 L 1082 420" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1082 420 L 190 420" fill="none" stroke="#12324D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="46.0" y="452.0" width="1148.0" height="60.0" rx="11" fill="#FFF6E5" stroke="#B47500" stroke-width="2"/><text x="620.0" y="490.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#7A5200" text-anchor="middle">RP = (R2 × R3) / (R2 + R3)    এবং    RT = R1 + RP</text></svg>