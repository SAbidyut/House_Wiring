<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="637" viewBox="0 0 1240 637"><defs><marker id="ar14" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path d="M 0.5 0.8 L 9.5 5 L 0.5 9.2 z" fill="#1D5B8F"/></marker></defs><rect width="1240" height="637" fill="#FFFFFF"/><text x="620.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">এস্টিমেট তৈরির ছয় ধাপ</text><rect x="50.0" y="110.0" width="360.0" height="172.0" rx="12" fill="#F7FAFC" stroke="#1D5B8F" stroke-width="2.4"/><circle cx="90.0" cy="150.0" r="22.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="90.0" y="157.7" font-family="Kalpurush" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">১</text><text x="126.0" y="158.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">লে-আউট চূড়ান্ত</text><text x="80.0" y="202.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">প্রতিটি ঘরে বাতি, ফ্যান, সকেট ও বোর্ড</text><text x="80.0" y="230.4" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">কোথায় বসবে তা কাগজে বসানো</text><path d="M 414 196.0 L 434 196.0" fill="none" stroke="#1D5B8F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar14)"/><rect x="440.0" y="110.0" width="360.0" height="172.0" rx="12" fill="#F7FAFC" stroke="#1D5B8F" stroke-width="2.4"/><circle cx="480.0" cy="150.0" r="22.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="480.0" y="157.7" font-family="Kalpurush" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">২</text><text x="516.0" y="158.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">পয়েন্ট গোনা</text><text x="470.0" y="202.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">লাইট, ফ্যান, সকেট, AC, গিজার —</text><text x="470.0" y="230.4" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">ধরনভেদে আলাদা করে সংখ্যা লেখা</text><path d="M 804 196.0 L 824 196.0" fill="none" stroke="#1D5B8F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar14)"/><rect x="830.0" y="110.0" width="360.0" height="172.0" rx="12" fill="#F7FAFC" stroke="#1D5B8F" stroke-width="2.4"/><circle cx="870.0" cy="150.0" r="22.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="870.0" y="157.7" font-family="Kalpurush" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">৩</text><text x="906.0" y="158.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">সার্কিট ভাগ</text><text x="860.0" y="202.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">বাতি-ফ্যান আলাদা, সকেট আলাদা;</text><text x="860.0" y="230.4" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">প্রতিটির তার ও ব্রেকার ঠিক করা</text><path d="M 1010.0 286 L 1010.0 321.0 L 230.0 321.0 L 230.0 354" fill="none" stroke="#1D5B8F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar14)"/><rect x="50.0" y="360.0" width="360.0" height="172.0" rx="12" fill="#F7FAFC" stroke="#1D5B8F" stroke-width="2.4"/><circle cx="90.0" cy="400.0" r="22.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="90.0" y="407.7" font-family="Kalpurush" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">৪</text><text x="126.0" y="408.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">দৈর্ঘ্য মাপা</text><text x="80.0" y="452.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">প্রতিটি পয়েন্টের তার ও পাইপের দৈর্ঘ্য</text><text x="80.0" y="480.4" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">প্ল্যান থেকে মেপে যোগ করা</text><path d="M 414 446.0 L 434 446.0" fill="none" stroke="#1D5B8F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar14)"/><rect x="440.0" y="360.0" width="360.0" height="172.0" rx="12" fill="#F7FAFC" stroke="#1D5B8F" stroke-width="2.4"/><circle cx="480.0" cy="400.0" r="22.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="480.0" y="407.7" font-family="Kalpurush" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">৫</text><text x="516.0" y="408.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">মালামালের তালিকা</text><text x="470.0" y="452.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">পরিমাণে ১০% অপচয় ধরে বাজারদর</text><text x="470.0" y="480.4" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">বসিয়ে মোট মূল্য বের করা</text><path d="M 804 446.0 L 824 446.0" fill="none" stroke="#1D5B8F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar14)"/><rect x="830.0" y="360.0" width="360.0" height="172.0" rx="12" fill="#F7FAFC" stroke="#1D5B8F" stroke-width="2.4"/><circle cx="870.0" cy="400.0" r="22.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="870.0" y="407.7" font-family="Kalpurush" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">৬</text><text x="906.0" y="408.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">মজুরি ও আনুষঙ্গিক</text><text x="860.0" y="452.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">পয়েন্ট-রেটে মজুরি, তারপর পরিবহন ও</text><text x="860.0" y="480.4" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">অন্যান্য খরচ যোগ করা</text><rect x="46.0" y="558.0" width="1148.0" height="55.3" rx="11" fill="#EAF2FA" stroke="#1D5B8F" stroke-width="2"/><text x="620.0" y="594.1" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="middle">ধাপ এড়িয়ে সরাসরি মালামালের তালিকা লিখলে হিসাব প্রায় সবসময়ই কম পড়ে — বিশেষত তারের দৈর্ঘ্যে</text></svg>