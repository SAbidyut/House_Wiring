<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730"><rect width="1240" height="730" fill="#FFFFFF"/><text x="620.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">আরসিসিবির সেনসিটিভিটি ও টাইপ</text><rect x="60.0" y="104.0" width="540.0" height="240.0" rx="13" fill="#FCFDFE" stroke="#C3CEDA" stroke-width="1.8"/><rect x="197.1" y="116.0" width="265.8" height="39.9" rx="9" fill="#1D5B8F" stroke="#1D5B8F" stroke-width="1.8"/><text x="330.0" y="142.2" font-family="Kalpurush" font-size="21.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">IΔn — কত লিকেজে ট্রিপ</text><text x="100.0" y="180.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="start">10mA</text><text x="200.0" y="180.0" font-family="Kalpurush" font-size="20" font-weight="700" fill="#5A6470" text-anchor="start">হাসপাতাল, ভেজা জায়গা</text><text x="100.0" y="224.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="start">30mA</text><text x="200.0" y="224.0" font-family="Kalpurush" font-size="20" font-weight="700" fill="#5A6470" text-anchor="start">মানুষের সুরক্ষা — বাসা/অফিস</text><rect x="80.0" y="198.0" width="460.0" height="36.0" rx="6" fill="#EAF6EF" stroke="#1B6E47" stroke-width="1.6"/><text x="100.0" y="268.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="start">100mA</text><text x="200.0" y="268.0" font-family="Kalpurush" font-size="20" font-weight="700" fill="#5A6470" text-anchor="start">মাঝারি — কিছু কারখানা</text><text x="100.0" y="312.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="start">300mA</text><text x="200.0" y="312.0" font-family="Kalpurush" font-size="20" font-weight="700" fill="#5A6470" text-anchor="start">আগুন থেকে সুরক্ষা</text><rect x="60.0" y="360.0" width="540.0" height="280.0" rx="13" fill="#FCFDFE" stroke="#C3CEDA" stroke-width="1.