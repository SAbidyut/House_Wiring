ight="400" fill="#28323C" text-anchor="start">টেপের মোট পুরুত্ব তারের নিজস্ব ইনসুলেশনের চেয়ে কম হবে না।</text><rect x="46.0" y="570.0" width="1148.0" height="58.0" rx="11" fill="#EAF2FA" stroke="#1D5B8F" stroke-width="2"/><text x="620.0" y="606.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="middle">PVC ইনসুলেশন টেপ IEC 60454-3-1 অনুযায়ী হতে হবে; কাপড়ের ফিতা বা কাগজের টেপ কোনোভাবেই চলবে না</text></svg>