<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="602" viewBox="0 0 1240 602"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M 0.5 0.8 L 9.5 5 L 0.5 9.2 z" fill="#1D5B8F"/></marker></defs><rect width="1240" height="602" fill="#FFFFFF"/><text x="620.0" y="52.0" font-family="Kalpurush" font-size="38" font-weight="700" fill="#0F3357" text-anchor="middle">সোল্ডারিং করার ধাপ</text><rect x="56.0" y="100.0" width="356.0" height="174.0" rx="13" fill="#F5F9FC" stroke="#1D5B8F" stroke-width="2"/><circle cx="102.0" cy="146.0" r="28.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="102.0" y="157.0" font-family="Kalpurush" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="144.0" y="157.0" font-family="Kalpurush" font-size="27" font-weight="700" fill="#0F3357" text-anchor="start">জয়েন্ট পরিষ্কার</text><text x="86.0" y="212.0" font-family="Kalpurush" font-size="23" font-weight="400" fill="#39434D" text-anchor="start">তেল, ময়লা ও অক্সাইড তুলে তামা</text><text x="86.0" y="243.7" font-family="Kalpurush" font-size="23" font-weight="400" fill="#39434D" text-anchor="start">ঝকঝকে করা</text><path d="M 416 187 L 434 187" fill="none" stroke="#1D5B8F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="442.0" y="100.0" width="356.0" height="174.0" rx="13" fill="#F5F9FC" stroke="#1D5B8F" stroke-width="2"/><circle cx="488.0" cy="146.0" r="28.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="488.0" y="157.0" font-family="Kalpurush" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="530.0" y="157.0" font-family="Kalpurush" font-size="27" font-weight="700" fill="#0F3357" text-anchor="start">ফ্লাক্স লাগানো</text><text x="472.0" y="212.0" font-family="Kalpurush" font-size="23" font-weight="400" fill="#39434D" text-anchor="start">জয়েন্টে র