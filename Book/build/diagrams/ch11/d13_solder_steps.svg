" height="174.0" rx="13" fill="#F5F9FC" stroke="#1D5B8F" stroke-width="2"/><circle cx="488.0" cy="356.0" r="28.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="488.0" y="367.0" font-family="Kalpurush" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="530.0" y="367.0" font-family="Kalpurush" font-size="27" font-weight="700" fill="#0F3357" text-anchor="start">সোল্ডার প্রয়োগ</text><text x="472.0" y="422.0" font-family="Kalpurush" font-size="23" font-weight="400" fill="#39434D" text-anchor="start">বিট জয়েন্টে চেপে ধরে সোল্ডার</text><text x="472.0" y="453.7" font-family="Kalpurush" font-size="23" font-weight="400" fill="#39434D" text-anchor="start">জয়েন্টে গলানো</text><path d="M 802 397 L 820 397" fill="none" stroke="#1D5B8F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="828.0" y="310.0" width="356.0" height="174.0" rx="13" fill="#F5F9FC" stroke="#1D5B8F" stroke-width="2"/><circle cx="874.0" cy="356.0" r="28.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="874.0" y="367.0" font-family="Kalpurush" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="916.0" y="367.0" font-family="Kalpurush" font-size="27" font-weight="700" fill="#0F3357" text-anchor="start">ঠান্ডা করা</text><text x="858.0" y="422.0" font-family="Kalpurush" font-size="23" font-weight="400" fill="#39434D" text-anchor="start">নড়াচড়া না করে ঠান্ডা হতে দেওয়া,</text><text x="858.0" y="453.7" font-family="Kalpurush" font-size="23" font-weight="400" fill="#39434D" text-anchor="start">তারপর টেপ লাগানো</text><path d="M 1006 280 L 1006 292 L 234 292 L 234 304" fill="none" stroke="#1D5B8F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="46.0" y="516.0" width="1148.0" height="62.0" rx="11" fill="#FFF6E5" stroke="#B47500" stroke-width="2"/><text x="620.0" y="555.0" font-family="Kalpurush" font-size="25" font-weight="700" fill=