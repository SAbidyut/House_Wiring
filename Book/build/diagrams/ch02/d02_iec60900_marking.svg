e-width="2" stroke-linejoin="round"/><polygon points="160.8,215.8 173.6,240.4 148.0,240.4" fill="none" stroke="#2A1405" stroke-width="3.04" stroke-linejoin="round"/><polygon points="191.2,215.8 204.0,240.4 178.4,240.4" fill="none" stroke="#2A1405" stroke-width="3.04" stroke-linejoin="round"/><text x="210.0" y="239.0" font-family="Kalpurush" font-size="24" font-weight="700" fill="#2A1405" text-anchor="start">1000 V</text><text x="152.0" y="276.0" font-family="Kalpurush" font-size="23" font-weight="700" fill="#2A1405" text-anchor="start">IEC 60900</text><rect x="84.0" y="336.0" width="532.0" height="54.0" rx="11" fill="#FFF6E5" stroke="#B47500" stroke-width="2"/><text x="350.0" y="369.0" font-family="Kalpurush" font-size="20" font-weight="700" fill="#7A5200" text-anchor="middle">মার্কিং হাতলের গায়েই থাকে — মুছে গেলে টুলটাই বাতিল</text><rect x="664.0" y="118.0" width="496.0" height="46.0" rx="10" fill="#0F3357" stroke="#0F3357" stroke-width="2"/><text x="912.0" y="149.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">গায়ে যা যা লেখা থাকবে</text><rect x="664.0" y="172.0" width="496.0" height="52.4" rx="8" fill="#F7FAFC" stroke="#C3CEDA" stroke-width="1.6"/><rect x="664.0" y="172.0" width="6.0" height="52.4" rx="3" fill="#1B6E47" stroke="none" stroke-width="0"/><text x="684.0" y="202.0" font-family="Kalpurush" font-size="20" font-weight="700" fill="#0F3357" text-anchor="start">দ্বৈত ত্রিভুজ</text><text x="864.0" y="202.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">জীবন্ত লাইনে ব্যবহারের উপযোগী</text><rect x="664.0" y="232.4" width="496.0" height="78.8" rx="8" fill="#F7FAFC" stroke="#C3CEDA" stroke-width="1.6"/><rect x="664.0" y="232.4" width="6.0" height="78.8" rx="3" fill="#1D5B8F" stroke="none" stroke-width="0"/><text x="684.0" y="262.4" font-family="Kalpurush" font-size="20" font-weight="700" fill="#0F3357" text-anchor="start">1000 V</text><text x="864.0" y="262.4" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">১০০০ V AC / ১৫০০ V DC পর্যন্ত</text><text x="864.0" y="288.8" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">অনুমোদিত</text><rect x="664.0" y="319.2" width="496.0" height="52.4" rx="8" fill="#F7FAFC" stroke="#C3CEDA" stroke-width="1.6"/><rect x="664.0" y="319.2" width="6.0" height="52.4" rx="3" fill="#1D5B8F" stroke="none" stroke-width="0"/><text x="684.0" y="349.2" font-family="Kalpurush" font-size="20" font-weight="700" fill="#0F3357" text-anchor="start">IEC 60900</text><text x="864.0" y="349.2" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">যে মান অনুসারে পরীক্ষা করা হয়েছে</text><rect x="664.0" y="379.6" width="496.0" height="52.4" rx="8" fill="#F7FAFC" stroke="#C3CEDA" stroke-width="1.6"/><rect x="664.0" y="379.6" width="6.0" height="52.4" rx="3" fill="#5A6470" stroke="none" stroke-width="0"/><text x="684.0" y="409.6" font-family="Kalpurush" font-size="20" font-weight="700" fill="#0F3357" text-anchor="start">প্রস্তুতকারকের নাম</text><text x="864.0" y="409.6" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">উৎস শনাক্তকরণ</text><rect x="664.0" y="440.0" width="496.0" height="52.4" rx="8" fill="#F7FAFC" stroke="#C3CEDA" stroke-width="1.6"/><rect x="664.0" y="440.0" width="6.0" height="52.4" rx="3" fill="#5A6470" stroke="none" stroke-width="0"/><text x="684.0" y="470.0" font-family="Kalpurush" font-size="20" font-weight="700" fill="#0F3357" text-anchor="start">তৈরির সন</text><text x="864.0" y="470.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">মেয়াদ ও ট্রেসেবিলিটি</text><rect x="70.0" y="526.4" width="1090.0" height="62.0" rx="11" fill="#FDECEA" stroke="#B32A22" stroke-width="2"/><text x="615.0" y="554.4" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#7A1810" text-anchor="middle">যে টুলে এই চিহ্ন নেই, তা দিয়ে জীবন্ত লাইনে কাজ করা যাবে না</text><text x="615.0" y="580.4" font-family="Kalpurush" font-size="20" font-weight="400" fill="#7A1810" text-anchor="middle">শুধু প্লাস্টিকের হাতল থাকা মানেই ইনসুলেটেড টুল নয় — মার্কিং দেখে নিশ্চিত হতে হবে</text></svg>