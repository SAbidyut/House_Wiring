<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="612" viewBox="0 0 1240 612"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path d="M 0.5 0.8 L 9.5 5 L 0.5 9.2 z" fill="#1D5B8F"/></marker></defs><rect width="1240" height="612" fill="#FFFFFF"/><text x="620.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">সোল্ডারিং করার ধাপ</text><rect x="56.0" y="130.0" width="356.0" height="168.0" rx="13" fill="#F5F9FC" stroke="#1D5B8F" stroke-width="2"/><circle cx="100.0" cy="172.0" r="26.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="100.0" y="182.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">১</text><text x="140.0" y="182.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">জয়েন্ট পরিষ্কার</text><text x="86.0" y="230.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">তেল, ময়লা ও অক্সাইড তুলে তামা</text><text x="86.0" y="257.2" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">ঝকঝকে করো</text><path d="M 416.0 214.0 L 434.0 214.0" fill="none" stroke="#1D5B8F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="442.0" y="130.0" width="356.0" height="168.0" rx="13" fill="#F5F9FC" stroke="#1D5B8F" stroke-width="2"/><circle cx="486.0" cy="172.0" r="26.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="486.0" y="182.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">২</text><text x="526.0" y="182.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">ফ্লাক্স লাগানো</text><text x="472.0" y="230.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">জয়েন্টে রজন বা সোল্ডারিং পেস্ট মাখাও</text><path d="M 802.0 214.0 L 820.0 214.0" fill="none" stroke="#1D5B8F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="828.0" y="130.0" width="356.0" height="168.0" rx="13" fill="#F5F9FC" stroke="#1D5B8F" stroke-width="2"/><circle cx="872.0" cy="172.0" r="26.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="872.0" y="182.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">৩</text><text x="912.0" y="182.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">আয়রন গরম</text><text x="858.0" y="230.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">বিট গরম হয়ে সোল্ডার সহজে গলা পর্যন্ত</text><text x="858.0" y="257.2" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">অপেক্ষা করো</text><rect x="56.0" y="332.0" width="356.0" height="168.0" rx="13" fill="#F5F9FC" stroke="#1D5B8F" stroke-width="2"/><circle cx="100.0" cy="374.0" r="26.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="100.0" y="384.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">৪</text><text x="140.0" y="384.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">বিট টিনিং</text><text x="86.0" y="432.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">গরম বিটে সামান্য সোল্ডার ধরিয়ে চকচকে</text><text x="86.0" y="459.2" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">আবরণ দাও</text><path d="M 416.0 416.0 L 434.0 416.0" fill="none" stroke="#1D5B8F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="442.0" y="332.0" width="356.0" height="168.0" rx="13" fill="#F5F9FC" stroke="#1D5B8F" stroke-width="2"/><circle cx="486.0" cy="374.0" r="26.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="486.0" y="384.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">৫</text><text x="526.0" y="384.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">সোল্ডার প্রয়োগ</text><text x="472.0" y="432.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">বিট জয়েন্টে চেপে ধরে সোল্ডার জয়েন্টে</text><text x="472.0" y="459.2" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">গলাও</text><path d="M 802.0 416.0 L 820.0 416.0" fill="none" stroke="#1D5B8F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="828.0" y="332.0" width="356.0" height="168.0" rx="13" fill="#F5F9FC" stroke="#1D5B8F" stroke-width="2"/><circle cx="872.0" cy="374.0" r="26.0" fill="#0F3357" stroke="none" stroke-width="2"/><text x="872.0" y="384.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">৬</text><text x="912.0" y="384.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="start">ঠান্ডা করা</text><text x="858.0" y="432.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">নড়াচড়া না করে ঠান্ডা হতে দাও, তারপর</text><text x="858.0" y="459.2" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">টেপ লাগাও</text><path d="M 1006.0 304 L 1006.0 315.0 L 234.0 315.0 L 234.0 326" fill="none" stroke="#1D5B8F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="46.0" y="530.0" width="1148.0" height="58.0" rx="11" fill="#FFF6E5" stroke="#B47500" stroke-width="2"/><text x="620.0" y="566.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#7A5200" text-anchor="middle">সোল্ডার গলবে জয়েন্টের তাপে — বিটের গায়ে গলিয়ে ফোঁটা ফেলে দিলে ভেতরে ঢোকে না, ঠান্ডা জোড়া (dry joint) হয়</text></svg>