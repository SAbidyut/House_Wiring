ke="#B47500" stroke-width="2"/><text x="1010.5" y="270.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">প্রান্তিক বা টার্মিনাল জয়েন্ট</text><rect x="828.0" y="306.0" width="365.0" height="232.0" rx="11" fill="#F7FAFC" stroke="#C3CEDA" stroke-width="1.8"/><circle cx="858.0" cy="341.0" r="6.0" fill="#B47500" stroke="none" stroke-width="2"/><text x="878.0" y="348.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#28323C" text-anchor="start">পিগটেল বা র‍্যাট-টেইল জয়েন্ট</text><circle cx="858.0" cy="393.0" r="6.0" fill="#B47500" stroke="none" stroke-width="2"/><text x="878.0" y="400.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#28323C" text-anchor="start">ফিক্সচার জয়েন্ট</text><circle cx="858.0" cy="445.0" r="6.0" fill="#B47500" stroke="none" stroke-width="2"/><text x="878.0" y="452.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#28323C" text-anchor="start">লাগ বা সকেট সংযোগ</text><circle cx="858.0" cy="497.0" r="6.0" fill="#B47500" stroke="none" stroke-width="2"/><text x="878.0" y="504.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#28323C" text-anchor="start">কানেক্টর ও কাপলার</text><rect x="46.0" y="566.0" width="1148.0" height="58.0" rx="11" fill="#EAF2FA" stroke="#1D5B8F" stroke-width="2"/><text x="620.0" y="602.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="middle">একক খেইয়ের (solid) তারে যে জয়েন্ট চলে, বহু খেইয়ের (stranded) তারে তা হুবহু চলে না — খেই আলাদা করে মেলাতে হয়</text></svg>