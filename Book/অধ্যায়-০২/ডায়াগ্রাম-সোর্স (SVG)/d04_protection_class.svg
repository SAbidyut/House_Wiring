<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="502" viewBox="0 0 1200 502"><rect width="1200" height="502" fill="#FFFFFF"/><text x="600.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">বৈদ্যুতিক সরঞ্জামের সুরক্ষা শ্রেণি (IEC 61140)</text><rect x="40.0" y="96.0" width="356.0" height="340.0" rx="13" fill="#EAF2FA" stroke="#1D5B8F" stroke-width="2"/><rect x="40.0" y="96.0" width="356.0" height="60.0" rx="13" fill="#1D5B8F" stroke="#1D5B8F" stroke-width="2"/><rect x="40.0" y="142.0" width="356.0" height="14.0" rx="0" fill="#EAF2FA" stroke="none" stroke-width="0"/><text x="218.0" y="138.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">ক্লাস I</text><line x1="218.0" y1="198.0" x2="218.0" y2="228.0" stroke="#1D5B8F" stroke-width="4" stroke-linecap="round"/><line x1="192.0" y1="230.0" x2="244.0" y2="230.0" stroke="#1D5B8F" stroke-width="4.4" stroke-linecap="round"/><line x1="201.0" y1="241.0" x2="235.0" y2="241.0" stroke="#1D5B8F" stroke-width="4.4" stroke-linecap="round"/><line x1="209.0" y1="252.0" x2="227.0" y2="252.0" stroke="#1D5B8F" stroke-width="4.4" stroke-linecap="round"/><text x="218.0" y="300.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#1D5B8F" text-anchor="middle">আর্থিং নির্ভর</text><text x="218.0" y="336.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#2E3842" text-anchor="middle">ধাতব বডি আর্থ তারে যুক্ত থাকে। থ্রি-পিন</text><text x="218.0" y="362.8" font-family="Kalpurush" font-size="20" font-weight="400" fill="#2E3842" text-anchor="middle">প্লাগ লাগে।</text><rect x="422.0" y="96.0" width="356.0" height="340.0" rx="13" fill="#EAF6EF" stroke="#1B6E47" stroke-width="2"/><rect x="422.0" y="96.0" width="356.0" height="60.0" rx="13" fill="#1B6E47" stroke="#1B6E47" stroke-width="2"/><rect x="422.0" y="142.0" width="356.0" height="14.0" rx="0" fill="#EAF6EF" stroke="none" stroke-width="0"/><text x="600.0" y="138.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">ক্লাস II</text><rect x="566.0" y="206.0" width="68.0" height="54.0" rx="3" fill="none" stroke="#1B6E47" stroke-width="4"/><rect x="578.0" y="215.0" width="44.0" height="36.0" rx="2" fill="none" stroke="#1B6E47" stroke-width="4"/><text x="600.0" y="300.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#1B6E47" text-anchor="middle">ডাবল ইনসুলেশন</text><text x="600.0" y="336.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#2E3842" text-anchor="middle">দুই স্তরের ইনসুলেশন থাকে, আর্থিং লাগে</text><text x="600.0" y="362.8" font-family="Kalpurush" font-size="20" font-weight="400" fill="#2E3842" text-anchor="middle">না। বেশির ভাগ পাওয়ার টুল এই শ্রেণির।</text><rect x="804.0" y="96.0" width="356.0" height="340.0" rx="13" fill="#FFF6E5" stroke="#B47500" stroke-width="2"/><rect x="804.0" y="96.0" width="356.0" height="60.0" rx="13" fill="#B47500" stroke="#B47500" stroke-width="2"/><rect x="804.0" y="142.0" width="356.0" height="14.0" rx="0" fill="#FFF6E5" stroke="none" stroke-width="0"/><text x="982.0" y="138.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">ক্লাস III</text><polygon points="982.0,198.0 1016.0,232.0 982.0,266.0 948.0,232.0" fill="none" stroke="#B47500" stroke-width="4" stroke-linejoin="round"/><text x="982.0" y="242.0" font-family="Kalpurush" font-size="26" font-weight="700" fill="#B47500" text-anchor="middle">III</text><text x="982.0" y="300.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#B47500" text-anchor="middle">অতি নিম্ন ভোল্টেজ</text><text x="982.0" y="336.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#2E3842" text-anchor="middle">SELV উৎসে চলে (৫০ V AC-এর নিচে)।</text><text x="982.0" y="362.8" font-family="Kalpurush" font-size="20" font-weight="400" fill="#2E3842" text-anchor="middle">শকের ঝুঁকি নেই বললেই চলে।</text><text x="600.0" y="478.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">পাওয়ার টুলের নেমপ্লেটে বর্গের ভেতর বর্গ দেখলে বুঝতে হবে সেটি ক্লাস II — আলাদা আর্থিং লাগবে না</text></svg>