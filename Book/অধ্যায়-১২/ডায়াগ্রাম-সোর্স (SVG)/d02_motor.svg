th="434.0" height="97.6" rx="11" fill="#F7FAFC" stroke="#C3CEDA" stroke-width="1.8"/><text x="782.0" y="150.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="start">দুটি কয়েল কেন</text><text x="782.0" y="180.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">একটি কয়েলে চুম্বকক্ষেত্র শুধু আগে-পিছে দোলে, ঘোরে</text><text x="782.0" y="206.8" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">না — তাই মোটর নিজে থেকে চালু হয় না।</text><rect x="760.0" y="231.6" width="434.0" height="97.6" rx="11" fill="#F7FAFC" stroke="#C3CEDA" stroke-width="1.8"/><text x="782.0" y="263.6" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="start">৯০° কোণে বসানো</text><text x="782.0" y="293.6" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">স্টার্টিং কয়েলকে রানিং কয়েলের সঙ্গে ৯০ ডিগ্রি কোণে</text><text x="782.0" y="320.4" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">বসানো হয়।</text><rect x="760.0" y="345.2" width="434.0" height="97.6" rx="11" fill="#F7FAFC" stroke="#C3CEDA" stroke-width="1.8"/><text x="782.0" y="377.2" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="start">ক্যাপাসিটরের কাজ</text><text x="782.0" y="407.2" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">ক্যাপাসিটর স্টার্টিং কয়েলের কারেন্টকে এগিয়ে দেয়; দুই</text><text x="782.0" y="434.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">কয়েলের কারেন্টে সময়ের ব্যবধান তৈরি হয়।</text><rect x="760.0" y="458.8" width="434.0" height="97.6" rx="11" fill="#F7FAFC" stroke="#C3CEDA" stroke-width="1.8"/><text x="782.0" y="490.8" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#0F3357" text-anchor="start">ফল</text><text x="782.0" y="520.8" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">দুই মিলে ঘূর্ণায়মান চুম্বকক্ষেত্র তৈরি হয় এবং রোটর</text><text x="782.0" y="547.6" font-family="Kalpurush" font-size="20" font-weight="400" fill="#39434D" text-anchor="start">ঘুরতে শুরু করে।</text><rect x="46.0" y="594.0" width="1148.0" height="58.0" rx="11" fill="#EAF2FA" stroke="#1D5B8F" stroke-width="2"/><text x="620.0" y="630.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="middle">সিলিং ফ্যানে ক্যাপাসিটর সবসময় লাইনে থাকে — চালু হওয়ার পরেও বিচ্ছিন্ন হয় না, একে বলে PSC মোটর</text></svg>