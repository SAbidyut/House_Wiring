<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="798" viewBox="0 0 1240 798"><rect width="1240" height="798" fill="#FFFFFF"/><text x="620.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">আর্থিং ও টেস্টে যে ভুলগুলো বারবার হয়</text><rect x="28.0" y="108.0" width="578.0" height="132.0" rx="12" fill="#FDECEA" stroke="#B32A22" stroke-width="2.4"/><text x="58.0" y="156.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#B32A22" text-anchor="start">✗</text><text x="102.0" y="160.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#0F3357" text-anchor="start">নিউট্রাল আর আর্থ এক করা</text><text x="102.0" y="204.0" font-family="Kalpurush" font-size="22" font-weight="600" fill="#8A2B22" text-anchor="start">বোর্ডেই দুটিকে জোড়া লাগানো</text><rect x="634.0" y="108.0" width="578.0" height="132.0" rx="12" fill="#FDECEA" stroke="#B32A22" stroke-width="2.4"/><text x="664.0" y="156.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#B32A22" text-anchor="start">✗</text><text x="708.0" y="160.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#0F3357" text-anchor="start">ইলেকট্রোড শুকনো মাটিতে</text><text x="708.0" y="204.0" font-family="Kalpurush" font-size="22" font-weight="600" fill="#8A2B22" text-anchor="start">শীতে ভালো, বর্ষার পরে খারাপ</text><rect x="28.0" y="258.0" width="578.0" height="132.0" rx="12" fill="#FDECEA" stroke="#B32A22" stroke-width="2.4"/><text x="58.0" y="306.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#B32A22" text-anchor="start">✗</text><text x="102.0" y="310.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#0F3357" text-anchor="start">ক্ল্যাম্প ঢিলা</text><text x="102.0" y="354.0" font-family="Kalpurush" font-size="22" font-weight="600" fill="#8A2B22" text-anchor="start">রং করা হয়নি, বছর ঘুরতেই মরিচা</text><rect x="634.0" y="258.0" width="578.0" height="132.0" rx="12" fill="#FDECEA" stroke="#B32A22" stroke-width="2.4"/><text x="664.0" y="306.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#B32A22" text-anchor="start">✗</text><text x="708.0" y="310.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#0F3357" text-anchor="start">পিট নেই</text><text x="708.0" y="354.0" font-family="Kalpurush" font-size="22" font-weight="600" fill="#8A2B22" text-anchor="start">মাটি চাপা দিয়ে দেওয়া, খুলে দেখার উপায় নেই</text><rect x="28.0" y="408.0" width="578.0" height="132.0" rx="12" fill="#FDECEA" stroke="#B32A22" stroke-width="2.4"/><text x="58.0" y="456.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#B32A22" text-anchor="start">✗</text><text x="102.0" y="460.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#0F3357" text-anchor="start">যন্ত্র লাগানো রেখে মেগার</text><text x="102.0" y="504.0" font-family="Kalpurush" font-size="22" font-weight="600" fill="#8A2B22" text-anchor="start">ইলেকট্রনিক্স পুড়ে যায়</text><rect x="634.0" y="408.0" width="578.0" height="132.0" rx="12" fill="#FDECEA" stroke="#B32A22" stroke-width="2.4"/><text x="664.0" y="456.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#B32A22" text-anchor="start">✗</text><text x="708.0" y="460.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#0F3357" text-anchor="start">লিড শূন্য না করে কন্টিনিউইটি</text><text x="708.0" y="504.0" font-family="Kalpurush" font-size="22" font-weight="600" fill="#8A2B22" text-anchor="start">প্রতিটি পাঠে বাড়তি রোধ</text><rect x="28.0" y="558.0" width="578.0" height="132.0" rx="12" fill="#FDECEA" stroke="#B32A22" stroke-width="2.4"/><text x="58.0" y="606.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#B32A22" text-anchor="start">✗</text><text x="102.0" y="610.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#0F3357" text-anchor="start">সুইচ নিউট্রালে</text><text x="102.0" y="654.0" font-family="Kalpurush" font-size="22" font-weight="600" fill="#8A2B22" text-anchor="start">সুইচ বন্ধ করেও হোল্ডার লাইভ</text><rect x="634.0" y="558.0" width="578.0" height="132.0" rx="12" fill="#FDECEA" stroke="#B32A22" stroke-width="2.4"/><text x="664.0" y="606.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#B32A22" text-anchor="start">✗</text><text x="708.0" y="610.0" font-family="Kalpurush" font-size="28" font-weight="700" fill="#0F3357" text-anchor="start">লাইন দেওয়ার পরে টেস্ট</text><text x="708.0" y="654.0" font-family="Kalpurush" font-size="22" font-weight="600" fill="#8A2B22" text-anchor="start">কোডে বলা আছে: আগে টেস্ট</text><rect x="46.0" y="716.0" width="1148.0" height="58.0" rx="11" fill="#EAF2FA" stroke="#1D5B8F" stroke-width="2"/><text x="620.0" y="752.0" font-family="Kalpurush" font-size="25" font-weight="700" fill="#0F3357" text-anchor="middle">প্রতিটি ভুলই টেস্টে ধরা পড়ে; শর্ত একটিই, টেস্টটি আসলে করতে হবে</text></svg>